name: Build

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: rustup component add rustfmt clippy
      - run: rustup target add thumbv6m-none-eabi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude lucy-embedded-firmware-rp2040 --exclude builder --all-targets -- -D warnings
      - run: cargo clippy --manifest-path firmwares/rp2040/Cargo.toml --release -- -D warnings

  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo test --workspace --exclude lucy-embedded-firmware-rp2040 --exclude builder

  rp2040:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmwares/rp2040
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add thumbv6m-none-eabi
      - run: cargo build --release

  coverage:
    name: Coverage (host crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --exclude lucy-embedded-firmware-rp2040 --exclude builder --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: lucy_embedded_firmware
          name: lucy_embedded_firmware
          fail_ci_if_error: false

  arduino_mega:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmwares/arduino_mega
    env:
      LUCY_MEGA_BOARD_CONFIG: ${{ github.workspace }}/firmwares/arduino_mega/ci/config_ci.rs
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc
      - run: cargo build --release
