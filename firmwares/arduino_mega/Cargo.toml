[[bin]]
name = "lucy-embedded-firmware-arduino-mega"
test = false
bench = false

[package]
name = "lucy-embedded-firmware-arduino-mega"
version = "0.1.0"
edition = "2024"

[dependencies]
lucy-embedded-firmware-core = { path = "../../crates/core" }
lucy-embedded-firmware-communication = { path = "../../crates/communication" }
lucy-embedded-firmware-pwm = { path = "../../crates/pwm" }
lucy-embedded-firmware-pwm-servo = { path = "../../crates/pwm-servo" }
lucy-embedded-firmware-security = { path = "../../crates/security" }

portable-atomic = { version = "1", features = ["critical-section"] }
panic-halt = "1.0.0"
embedded-hal = "1.0"
avr-device = { version = "0.8.1", features = ["atmega2560", "rt"] }

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e0b0105b11a7"
features = ["arduino-mega2560"]

[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
