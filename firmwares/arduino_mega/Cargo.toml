[[bin]]
name = "lucy-embedded-firmware-arduino-mega"
test = false
bench = false

[package]
name = "lucy-embedded-firmware-arduino-mega"
version = "0.1.0"
edition = "2024"

[features]
# Servos on the Nervo board's PCA9685 (I2C). Without it: servo straight on Mega pin D6.
default = ["nervo"]
nervo = ["dep:embedded-hal"]

[dependencies]
lucy-embedded-firmware-core = { path = "../../crates/core" }
lucy-embedded-firmware-communication = { path = "../../crates/communication" }
lucy-embedded-firmware-pwm = { path = "../../crates/pwm" }

portable-atomic = { version = "1", features = ["critical-section"] }
panic-halt = "1.0.0"
embedded-hal = { version = "1.0", optional = true }

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e0b0105b11a7"
features = ["arduino-mega2560"]

# Excluded from the root workspace (AVR needs its own nightly), so these profiles apply.
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
