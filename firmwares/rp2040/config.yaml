version: 1
robot_name: inmoov
generated_files:
  ros2_control_xacro: inmoov_ros2_control.xacro
  controllers_yaml: controllers.yaml
passive_urdf_joints: []
ignore_urdf_joints:
  - Empty.001_link_joint
  - Empty.002_link_joint
  - i01.leftHand.index2_link_joint
  - i01.leftHand.index3_link_joint
  - i01.leftHand.majeure2_link_joint
  - i01.leftHand.majeure3_link_joint
  - i01.leftHand.pinky0_link_joint
  - i01.leftHand.pinky2_link_joint
  - i01.leftHand.pinky3_link_joint
  - i01.leftHand.ringfinger0_link_joint
  - i01.leftHand.ringfinger2_link_joint
  - i01.leftHand.ringfinger3_link_joint
  - i01.leftHand.thumb1_link_joint
  - i01.leftHand.thumb3_link_joint
  - i01.leftHand.wrist.001_link_joint
  - i01.rightHand.index2_link_joint
  - i01.rightHand.index3_link_joint
  - i01.rightHand.majeure2_link_joint
  - i01.rightHand.majeure3_link_joint
  - i01.rightHand.pinky0_link_joint
  - i01.rightHand.pinky2_link_joint
  - i01.rightHand.pinky3_link_joint
  - i01.rightHand.ringfinger0_link_joint
  - i01.rightHand.ringfinger2_link_joint
  - i01.rightHand.ringfinger3_link_joint
  - i01.rightHand.thumb1_link_joint
  - i01.rightHand.thumb3_link_joint
  - i01.rightHand.wrist.001_link_joint

cameras:
  - id: 'ext_camera'
    name: 'External USB Webcam'
    topic: '/ext_camera/jpg'
    compressed_topic: '/ext_camera/jpg/compressed'
    message_type: 'sensor_msgs/msg/CompressedImage'
    external: true
    sim_gz_topic: '/world/default/camera'
  
  - realsense-rgb:
    name: 'Realsense RGB'
    topic: '/realsense/realsense2_camera/color/image_raw'
    compressed_topic: '/realsense/realsense2_camera/color/image_raw/compressed'
    message_type: 'sensor_msgs/msg/CompressedImage'
    external: false
    link: 'i01.head.eyeLeft_link'

  - realsense-aligned-depth:
    name: 'Realsense Aligned Depth'
    topic: '/realsense/realsense2_camera/aligned_depth_to_color/image_raw'
    compressed_topic: '/realsense/realsense2_camera/aligned_depth_to_color/image_raw/compressed'
    message_type: 'sensor_msgs/msg/CompressedImage'
    external: false
    link: 'i01.head.eyeLeft_link'

  - left_eye_camera:
    name: 'Left eye webcam'
    topic: '/camera/internal/left_eye/jpg'
    compressed_topic: '/camera/internal/left_eye/jpg/compressed'
    message_type: 'sensor_msgs/msg/CompressedImage'
    external: false
    link: 'i01.head.eyeRight_link'

  - right_eye_camera:
    name: 'Right eye webcam'
    topic: '/camera/internal/right_eye/jpg'
    compressed_topic: '/camera/internal/right_eye/jpg/compressed'
    message_type: 'sensor_msgs/msg/CompressedImage'
    external: false
    link: 'i01.head.eyeLeft_link'


firmware:
  source_dir: micro_ros_raspberrypi_pico_sdk
  build_dir: build
controller_manager:
  update_rate: 100

boards:
  rp2040:
    serial_id: E6617C93E3858429
    firmware_target: lucy_embed
    topic_actuators: actuators/left_arm
    topic_sensors: sensors/left_arm
    controller:
      name: left_arm_controller
      type: joint_trajectory_controller/JointTrajectoryController

extensions:
  adafruit:
    type: AdafruitDriver

    hardware:
      board: rp2040
      pin: sda

groups:
- name: pwm_servos
  driver: PwmServoDriver
  port: pwm_0
  actuators:
    - id: left_shoulder_y_torso
      urdf_joint: left_shoulder_y_link_joint
      enabled: true

      config:
        min_pulse: 0
        max_pulse: 3500
        limit_min: 0
        limit_max: 180
        default: 0
- name: feetech
  driver: FeetechBusDriver
  port: uart_0
  actuators:
    - id: left_shoulder_y_torso
      urdf_joint: left_shoulder_y_link_joint
      enabled: true

      config:
        min_pulse: 0
        max_pulse: 3500
        limit_min: 0
        limit_max: 180
        default: 0
